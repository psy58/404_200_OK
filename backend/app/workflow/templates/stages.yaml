# 업무 유형별 표준 단계 그래프.
#
# 문서를 (사업, 단계)로 배정하기만 하면 순서는 여기서 나온다. 문서끼리 견주어
# "이게 저것 다음인가"를 추론하지 않는다. 짧은 제목으로 관계를 맞히는 것보다
# 단계 하나를 고르는 편이 훨씬 잘 맞기 때문이다.
#
# stages 에 적힌 차례가 곧 업무 순서다. 그 사업에서 실제로 나타난 단계만
# 골라 워크플로를 만든다.

templates:
  - id: public_call
    name: 공모 참여 사업
    description: 교육청이 공모하고 학교가 신청해 선정되면 운영하는 사업
    # 이 단계들이 함께 보이면 공모형으로 본다
    signals: [공모안내, 신청추천]
    stages:
      - 공모안내
      - 신청추천
      - 선정결과
      - 계획수립
      - 운영
      - 지출정산
      - 결과보고

  - id: internal_program
    name: 자체 운영 사업
    description: 학교가 계획을 세워 직접 운영하고 정산하는 사업
    signals: [계획수립]
    stages:
      - 계획수립
      - 신청추천
      - 운영
      - 지출정산
      - 결과보고

  - id: request_and_settle
    name: 요청·지출 업무
    description: 물품 구매나 비용 지출처럼 계획 없이 요청과 정산으로 끝나는 업무
    signals: [지출정산]
    stages:
      - 신청추천
      - 지출정산

  - id: notice_only
    name: 안내 수신
    description: 받아 두기만 하는 안내 공문
    signals: [공모안내]
    stages:
      - 공모안내
