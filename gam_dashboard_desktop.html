<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GAM · Get A Map — 학교 업무 내비게이션</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"/>
<style>
/* ============================================================
   GAM Design Tokens — 데스크톱 워크스페이스 기준
   ============================================================ */
:root{
  --navy-950:#071C33;
  --navy-900:#0A2544;
  --navy-800:#0B3159;
  --navy-700:#0B4171;   /* Primary */
  --navy-600:#125288;
  --navy-500:#2C6DAE;
  --navy-300:#7FA6C9;
  --navy-200:#B6CFE5;
  --navy-100:#DCE8F3;
  --navy-050:#EFF5FA;

  --bg:#F4F7FA;          /* 데스크톱 장시간 사용 기준: 캔버스를 살짝 낮춰 카드가 뜨게 함 */
  --surface:#FFFFFF;
  --sunken:#F8FAFC;

  --line:#E2E8F0;
  --line-soft:#EEF2F7;

  --ink:#0F172A;
  --ink-2:#475569;
  --ink-3:#7C8BA1;
  --ink-4:#A9B4C4;

  --ok:#10B981;      --ok-bg:#E9F8F2;   --ok-ink:#067A55;
  --warn:#F59E0B;    --warn-bg:#FEF5E6; --warn-ink:#B4740A;
  --danger:#EF4444;  --danger-bg:#FDECEC;--danger-ink:#C93838;

  --gam:#F4581C;     --gam-bg:#FEF0E9;  --gam-ink:#B84610;

  --sh-1:0 1px 3px 0 rgba(15,23,42,.05);
  --sh-2:0 6px 20px -6px rgba(11,65,113,.10), 0 1px 3px rgba(15,23,42,.04);
  --sh-pop:0 24px 60px -16px rgba(7,28,51,.28), 0 2px 8px rgba(0,0,0,.06);

  --r-card:16px; --r-ctl:10px; --r-pill:999px;
  --sidebar:268px; --topbar:56px;
  --ff:"Pretendard Variable",Pretendard,Inter,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff);
  font-size:14.5px;line-height:1.6;font-weight:450;letter-spacing:-.012em;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--navy-600);outline-offset:2px;border-radius:6px}
::selection{background:var(--navy-100)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.02em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* scrollbar — 데스크톱에서 하루 종일 보는 화면 */
*::-webkit-scrollbar{width:11px;height:11px}
*::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:8px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:#94A3B8;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* ---------- Type ---------- */
.t-display{font-size:29px;font-weight:750;letter-spacing:-.038em;line-height:1.25;margin:0}
.t-h1{font-size:19px;font-weight:700;letter-spacing:-.028em;margin:0}
.t-h2{font-size:16px;font-weight:650;letter-spacing:-.024em;margin:0}
.t-cap{font-size:12.5px;color:var(--ink-3);line-height:1.55}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-4)}

/* ============================================================
   Shell
   ============================================================ */
.app{display:flex;min-height:100vh}

/* ---- Sidebar ---- */
.side{
  width:var(--sidebar);flex:0 0 var(--sidebar);position:fixed;inset:0 auto 0 0;z-index:60;
  background:linear-gradient(180deg,#0C2C4F 0%, #0A2340 55%, #081D36 100%);
  color:#CBDCEC;display:flex;flex-direction:column;
}
.brand{padding:26px 22px 22px;display:flex;align-items:center;gap:11px}
.brand .wm{line-height:1}
.brand .wm1{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.03em;display:block}
.brand .wm2{font-size:9.5px;font-weight:700;letter-spacing:.24em;color:var(--gam);display:block;margin-top:5px}

.ctx{
  margin:0 16px 20px;padding:16px 17px;border-radius:14px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
}
.ctx .lab{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#7EA0C0;text-transform:uppercase}
.ctx .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:9px}
.ctx .nm{font-size:16px;font-weight:700;color:#fff;letter-spacing:-.028em}
.ctx .chg{font-size:12px;font-weight:600;color:var(--navy-200);flex:0 0 auto}
.ctx .chg:hover{color:#fff;text-decoration:underline}
.ctx .mt{font-size:11.5px;color:#7EA0C0;margin-top:6px}

.nav{padding:0 14px;display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:11px 13px;border-radius:11px;font-size:14.5px;font-weight:550;color:#A9C0D6;
  transition:background .14s,color .14s;
}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item[aria-current="page"]{background:rgba(255,255,255,.11);color:#fff;font-weight:680;box-shadow:inset 3px 0 0 var(--gam)}
.nav-item svg{flex:0 0 19px;opacity:.92}
.nav-badge{
  margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-pill);
  background:var(--danger);color:#fff;font-size:11px;font-weight:750;
  display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;
}
.nav-sep{height:1px;background:rgba(255,255,255,.1);margin:14px 13px}

.side-foot{margin-top:auto;padding:20px 22px 24px;border-top:1px solid rgba(255,255,255,.07)}
.side-foot p{margin:0;font-size:11.5px;line-height:1.65;color:#6D8CAA}
.side-foot .em{color:#9FBDD8;font-weight:600}

/* ---- Main ---- */
.main{flex:1;min-width:0;margin-left:var(--sidebar);display:flex;flex-direction:column}

.topbar{
  height:var(--topbar);position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:0 32px;background:rgba(244,247,250,.82);backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid rgba(226,232,240,.8);
}
.hamb{display:none;width:34px;height:34px;border-radius:9px;align-items:center;justify-content:center;color:var(--ink-2)}
.date-now{font-size:12.5px;font-weight:600;color:var(--ink-2);flex:0 0 auto}
.date-now span{color:var(--ink-4);font-weight:500}

.search-wrap{position:relative;flex:1;max-width:440px;margin-left:8px}
.search{display:flex;align-items:center;gap:9px;height:36px;padding:0 13px;background:#fff;border:1px solid var(--line);border-radius:10px;transition:.15s}
.search:focus-within{border-color:var(--navy-300);box-shadow:0 0 0 3px rgba(44,109,174,.12)}
.search input{border:0;background:none;outline:none;flex:1;font-size:13px}
.search input::placeholder{color:var(--ink-4)}
.search kbd{font-family:var(--ff);font-size:10px;font-weight:600;color:var(--ink-4);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.results{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh-pop);padding:8px;max-height:60vh;overflow:auto;z-index:70}
.res-item{display:block;width:100%;text-align:left;padding:10px 11px;border-radius:9px}
.res-item:hover{background:var(--navy-050)}
.res-item .rt{font-size:13.5px;font-weight:600}
.res-item .rm{font-size:12px;color:var(--ink-3);margin-top:3px;display:flex;gap:7px;align-items:center}
.res-group{padding:11px 11px 5px}

.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);position:relative;transition:.14s}
.icon-btn:hover{background:#fff;color:var(--navy-700);box-shadow:var(--sh-1)}
.icon-btn .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--gam);border:2px solid var(--bg)}
.who{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 4px;border-radius:10px}
.who:hover{background:#fff;box-shadow:var(--sh-1)}
.ava{width:28px;height:28px;border-radius:8px;background:var(--navy-700);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.who .n{font-size:12.5px;font-weight:650;line-height:1.3}
.who .r{font-size:11px;color:var(--ink-3);line-height:1.3}

.view{padding:34px 32px 96px;width:100%;max-width:1560px;margin:0 auto;flex:1}
.stack{display:flex;flex-direction:column;gap:24px}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.page-head .sub{margin:9px 0 0;font-size:14px;color:var(--ink-3)}
.page-head .sub b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

/* ---- Card ---- */
.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh-1);border:1px solid rgba(226,232,240,.65)}
.card-pad{padding:26px 28px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.card-head .lead{display:flex;align-items:center;gap:10px}
.dot-m{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.divider{height:1px;background:var(--line-soft);margin:22px -28px}
.sec-tag{font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:6px;display:block}

/* ---- Buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:var(--r-ctl);font-size:13.5px;font-weight:650;letter-spacing:-.015em;white-space:nowrap;transition:.15s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--navy-700);color:#fff}
.btn-primary:hover{background:var(--navy-600)}
.btn-quiet{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
.btn-quiet:hover{border-color:var(--navy-300);color:var(--navy-700)}
.btn-ghost{color:var(--navy-700)}
.btn-ghost:hover{background:var(--navy-050)}
.btn-sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.42;pointer-events:none}
.link-more{font-size:13px;font-weight:650;display:inline-flex;align-items:center;gap:5px}
.link-more:hover{text-decoration:underline}

/* ---- Chips ---- */
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:7px;font-size:11.5px;font-weight:650;background:var(--sunken);color:var(--ink-2)}
.chip.ok{background:var(--ok-bg);color:var(--ok-ink)}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.chip.danger{background:var(--danger-bg);color:var(--danger-ink)}
.chip.navy{background:var(--navy-050);color:var(--navy-700)}
.chip.gam{background:var(--gam-bg);color:var(--gam-ink)}
.src{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:3px 8px;border-radius:6px}
.src svg{width:12px;height:12px}
.src.official{background:var(--navy-050);color:var(--navy-700)}
.src.school{background:var(--gam-bg);color:var(--gam-ink)}
.src.exp{background:#F1F5F9;color:#526379}

/* ============================================================
   KPI — 좌측 accent bar
   ============================================================ */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.kpi{
  position:relative;background:#fff;border-radius:var(--r-card);border:1px solid rgba(226,232,240,.65);
  box-shadow:var(--sh-1);padding:22px 24px 20px 26px;text-align:left;width:100%;overflow:hidden;
  transition:box-shadow .18s,transform .18s;
}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc)}
.kpi:hover{box-shadow:var(--sh-2);transform:translateY(-2px)}
.kpi .kt{font-size:13px;font-weight:650;color:var(--ink-2)}
.kpi .kn{display:flex;align-items:baseline;gap:3px;margin-top:12px;color:var(--acc)}
.kpi .kn b{font-size:38px;font-weight:780;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.kpi .kn i{font-style:normal;font-size:15px;font-weight:650}
.kpi .km{font-size:12.5px;color:var(--ink-3);margin-top:12px}
.kpi .kl{margin-top:14px;font-size:13px;font-weight:700;color:var(--acc);display:inline-flex;align-items:center;gap:5px}
.kpi:hover .kl{text-decoration:underline}

/* ---- Home 2-column ---- */
.grid-main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:22px;align-items:start}
.col-side{position:sticky;top:calc(var(--topbar) + 24px);display:flex;flex-direction:column;gap:22px}

/* ---- Task rows ---- */
.trow{display:grid;grid-template-columns:60px minmax(0,1fr) 190px 22px;gap:20px;align-items:center;padding:18px 8px;width:100%;text-align:left;border-radius:12px;transition:background .14s}
.trow:hover{background:var(--sunken)}
.trow + .trow{border-top:1px solid var(--line-soft)}
.dd{height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:780;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dd.d0{background:var(--danger-bg);color:var(--danger-ink)}
.dd.d1{background:var(--warn-bg);color:var(--warn-ink)}
.dd.d2{background:var(--navy-050);color:var(--navy-700)}
.trow .tt{font-size:15px;font-weight:680;letter-spacing:-.025em}
.trow .tm{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:8px;font-size:12.5px;color:var(--ink-3)}
.trow .tm .k{color:var(--ink-4)}
.trow .tm .v{color:var(--ink-2);font-weight:650;font-variant-numeric:tabular-nums}
.trow .tm .prev .v{color:var(--gam-ink)}
.prog{display:flex;align-items:center;gap:11px}
.prog .bar{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--navy-700);border-radius:4px;transition:width .4s}
.prog .pn{font-size:12.5px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:0 0 auto}
.trow .go{color:var(--ink-4);display:flex}
.trow:hover .go{color:var(--navy-700)}

/* ---- Doc feed ---- */
.dfeed{display:flex;gap:13px;padding:16px 6px;width:100%;text-align:left;border-radius:11px;transition:background .14s}
.dfeed:hover{background:var(--sunken)}
.dfeed + .dfeed{border-top:1px solid var(--line-soft)}
.dfeed .stamp{flex:0 0 42px;height:26px;border-radius:7px;background:var(--ok-bg);color:var(--ok-ink);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.dfeed .stamp.send{background:var(--navy-050);color:var(--navy-700)}
.dfeed .dt{font-size:14px;font-weight:650;letter-spacing:-.022em;line-height:1.45}
.dfeed .dm{font-size:12px;color:var(--ink-3);margin-top:5px;font-variant-numeric:tabular-nums}
.dfeed .dl{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:12.5px;font-weight:620;color:var(--navy-700)}
.dfeed .dl svg{flex:0 0 13px;opacity:.8}

/* ---- Notes ---- */
.note{padding:20px 22px;border-radius:14px;background:#fff;border:1px solid rgba(226,232,240,.7);box-shadow:var(--sh-1)}
.note-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.note p{margin:0;font-size:14px;line-height:1.72}
.note-foot{display:flex;align-items:center;gap:13px;margin-top:15px;padding-top:13px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--ink-3)}
.note-foot .w{font-weight:650;color:var(--ink-2)}
.mini-note{padding:15px 16px;border-radius:12px;background:var(--sunken)}
.mini-note + .mini-note{margin-top:11px}
.mini-note p{margin:9px 0 0;font-size:13px;line-height:1.68}
.mini-note .mf{font-size:11.5px;color:var(--ink-4);margin-top:10px}

/* ---- Rail (3 dates) ---- */
.rail-track{position:relative;height:52px;margin:8px 8px 0}
.rail-line{position:absolute;left:0;right:0;top:24px;height:4px;border-radius:4px;background:var(--line)}
.rail-fill{position:absolute;top:24px;height:4px;border-radius:4px;background:var(--navy-300)}
.rnode{position:absolute;top:18px;transform:translateX(-50%)}
.rnode i{display:block;width:11px;height:11px;border-radius:50%;background:#fff;border:3px solid var(--navy-300)}
.rnode.due i{border-color:var(--navy-700);background:var(--navy-700)}
.rnode.now i{border-color:var(--ok);box-shadow:0 0 0 4px rgba(16,185,129,.16)}
.rnode.prev i{border-color:var(--gam);background:var(--gam)}
.rcap{position:absolute;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:680;font-variant-numeric:tabular-nums}
.rcap.up{top:-2px} .rcap.dn{top:38px}
.legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line-soft)}
.leg{display:flex;gap:9px;min-width:150px}
.leg .sw{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:0 0 9px}
.leg .lt{font-size:11px;font-weight:650;color:var(--ink-3)}
.leg .lv{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---- Table ---- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl thead th{position:sticky;top:var(--topbar);background:#fff;text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.03em;padding:12px 16px;white-space:nowrap;border-bottom:1px solid var(--line);z-index:2}
.tbl thead th button{display:inline-flex;align-items:center;gap:5px;color:inherit}
.tbl thead th button:hover{color:var(--navy-700)}
.tbl thead th[aria-sort] button{color:var(--navy-700)}
.tbl tbody tr{cursor:pointer;transition:background .13s}
.tbl tbody tr:hover{background:var(--sunken)}
.tbl tbody td{padding:17px 16px;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .dt1{font-weight:650;letter-spacing:-.02em}
.tbl .dt2{font-size:12px;color:var(--ink-4);margin-top:4px;font-variant-numeric:tabular-nums}

/* ---- Filters ---- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fchip{height:34px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:620;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;transition:.14s}
.fchip:hover{border-color:var(--navy-300);color:var(--navy-700)}
.fchip[aria-pressed="true"]{background:var(--navy-700);border-color:var(--navy-700);color:#fff}
.fchip .c{font-size:11px;opacity:.72;font-variant-numeric:tabular-nums}

/* ---- Year map ---- */
.map-scroll{overflow-x:auto}
.map-inner{min-width:1040px}
.map-months{display:grid;grid-template-columns:230px repeat(12,1fr);padding-bottom:11px;border-bottom:1px solid var(--line)}
.map-months .mh{font-size:11.5px;font-weight:650;color:var(--ink-3);text-align:center}
.map-months .mh.now{color:var(--navy-700);font-weight:780}
.map-row{display:grid;grid-template-columns:230px repeat(12,1fr);align-items:center;min-height:58px}
.map-row + .map-row{border-top:1px solid var(--line-soft)}
.map-row:hover{background:var(--sunken)}
.map-label{padding:10px 16px 10px 4px;font-size:13.5px;font-weight:620;letter-spacing:-.02em;line-height:1.4}
.map-label .mm{display:block;font-size:11.5px;color:var(--ink-4);font-weight:500;margin-top:3px;font-variant-numeric:tabular-nums}
.map-bar{grid-row:1;height:32px;border-radius:9px;display:flex;align-items:center;gap:8px;padding:0 11px;background:var(--navy-050);border:1px solid var(--navy-100);color:var(--navy-700);font-size:11.5px;font-weight:650;overflow:hidden;white-space:nowrap;transition:.14s}
.map-bar:hover{background:var(--navy-100);border-color:var(--navy-300)}
.map-bar.done{background:#F1F5F9;border-color:var(--line);color:var(--ink-3)}
.map-bar.live{background:var(--navy-700);border-color:var(--navy-700);color:#fff}
.map-bar .pm{width:7px;height:7px;border-radius:50%;background:var(--gam);flex:0 0 7px}
.map-now{position:absolute;top:0;bottom:0;width:2px;background:var(--ok);opacity:.5;pointer-events:none}

.check.on .ct{color:var(--ink-4);text-decoration:line-through}
.check .ct{font-size:14px;font-weight:560}
.check .cm{font-size:12px;color:var(--ink-4);margin-top:3px}

.chain{position:relative;padding-left:26px}
.chain::before{content:"";position:absolute;left:9px;top:14px;bottom:14px;width:2px;background:var(--line)}
.chain-i{position:relative;padding:12px 0}

.chain-i .cd{font-size:12px;color:var(--ink-3);margin-top:4px;font-variant-numeric:tabular-nums}

.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-i{position:relative;padding:9px 0}
.tl-i::before{content:"";position:absolute;left:-23px;top:15px;width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid var(--gam)}
.tl-i .d{font-size:12px;font-weight:700;color:var(--gam-ink);font-variant-numeric:tabular-nums}
.tl-i .x{font-size:13.5px;font-weight:550;margin-top:3px}

.frow{display:grid;grid-template-columns:32px 1fr auto;gap:13px;align-items:center;padding:13px 4px}

.frow .fm{font-size:11.5px;color:var(--ink-4);margin-top:3px}

.ho-line .k{color:var(--ink-3)}
.ho-line .v{font-weight:620;font-variant-numeric:tabular-nums;text-align:right}

.fab:hover{background:var(--navy-600);transform:translateY(-2px);box-shadow:0 18px 34px -10px rgba(11,65,113,.55)}

.modal-body{padding:26px 30px;overflow:auto}
.modal-foot{padding:17px 30px;border-top:1px solid var(--line-soft);display:flex;gap:10px;justify-content:flex-end;background:var(--sunken)}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:95;box-shadow:var(--sh-pop);display:flex;flex-direction:column}
.panel-head{padding:22px 24px 18px;border-bottom:1px solid var(--line-soft)}
.panel-body{flex:1;overflow:auto}
.notif{display:flex;gap:13px;padding:17px 24px;width:100%;text-align:left;transition:background .14s}

.draft .dm{font-size:12.5px;color:#8A5D0B;margin-top:6px;line-height:1.6}

.sugg{width:100%;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;transition:.14s}

.sugg .sm{display:block;font-size:11.5px;font-weight:500;color:var(--ink-4);margin-top:5px}

.toasts{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:9px;align-items:center}
.toast{background:var(--navy-950);color:#fff;padding:13px 20px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--sh-pop);display:flex;gap:10px;align-items:center;animation:ti .26s cubic-bezier(.2,.9,.3,1)}
@keyframes ti{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmt=s=>{const d=D(s);return `${d.getMonth()+1}.${String(d.getDate()).padStart(2,'0')}`};
const fmtY=s=>{const d=D(s);return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`};

/* 시그니처: 3-날짜 레일 */
function rail(t){
  const prep=D(t.prep),due=D(t.due),prev=D(t.prev);
  const pv=new Date(prev.getFullYear()+1,prev.getMonth(),prev.getDate());
  const lo=new Date(Math.min(prep,pv,TODAY)-7*864e5), hi=new Date(Math.max(due,TODAY)+7*864e5);
  const sp=days(lo,hi)||1, p=d=>Math.max(3,Math.min(97,days(lo,d)/sp*100));
  const a=p(prep),b=p(due),n=p(TODAY),v=p(pv);
  return `<div class="rail-track">
    <span class="rail-line"></span><span class="rail-fill" style="left:${a}%;width:${Math.max(0,n-a)}%"></span>
    <span class="rcap up" style="left:${a}%;color:var(--navy-500)">준비 ${fmt(t.prep)}</span>
    <span class="rnode" style="left:${a}%"><i></i></span>
    <span class="rnode prev" style="left:${v}%"><i></i></span>
    <span class="rcap dn" style="left:${v}%;color:var(--gam-ink)">작년 ${fmt(t.prev)}</span>
    <span class="rnode now" style="left:${n}%"><i></i></span>
    <span class="rcap up" style="left:${n}%;color:var(--ok-ink)">오늘</span>
    <span class="rnode due" style="left:${b}%"><i></i></span>
    <span class="rcap dn" style="left:${b}%;color:var(--navy-700)">마감 ${fmt(t.due)}</span>
  </div>`;
}

function taskRow(t){
  const n=dd(t.due), cls=n<=5?'d0':(n<=14?'d1':'d2');
  const pct=Math.round(t.done/t.total*100);
  return `<button class="trow" data-task="${t.id}">
    <span class="dd ${cls} num">${n<0?'지남':'D-'+n}</span>
    <span>
      <span class="tt">${esc(t.t)}</span>
      <span class="tm">
        <span class="chip">${esc(t.cat)}</span>
        <span><span class="k">공식 마감</span> <span class="v">${fmt(t.due)}</span></span>
        <span class="prev"><span class="k">작년 처리</span> <span class="v">${fmt(t.prev)}</span></span>
      </span>
    </span>
    <span class="prog"><span class="bar"><i style="width:${pct}%"></i></span><span class="pn">${t.done}/${t.total}</span></span>
    <span class="go">${I.chev}</span>
  </button>`;
}

  let h=g('업무',ts.map(t=>`<button class="res-item" data-task="${t.id}"><span class="rt">${esc(t.t)}</span>
      <span class="rm num">마감 ${fmtY(t.due)} · 작년 ${fmt(t.prev)}</span></button>`))
    + g('문서',ds.map(d=>`<button class="res-item" data-route="docs"><span class="rt">${esc(d.t)}</span>
      <span class="rm">${srcTag(d.s)} ${esc(d.no)}</span></button>`))
    + g('경험 메모',ns.map(n=>`<button class="res-item" data-route="notes"><span class="rt">${esc(n.b.slice(0,40))}…</span>
      <span class="rm">${srcTag('exp')} ${esc(n.task)} · ${n.y}</span></button>`));
  if(!h)h=`<div class="empty" style="padding:34px 18px"><p class="t-h2">"${esc(q)}" 결과가 없습니다</p>
    <p class="t-cap" style="margin-top:6px">업무명이나 공문 제목의 일부만 입력해 보세요.</p></div>`;
  box.innerHTML=h;box.hidden=false;
}

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const q=s=>e.target.closest(s);
  if(q('[data-close]')||(e.target.hasAttribute&&e.target.hasAttribute('data-scrim'))){clearInterval(timer);close();return}
  if(q('[data-navclose]')){document.body.classList.remove('nav-on');return}
  const tk=q('[data-task]');
  if(tk){state.task=tk.dataset.task;state.route='task';$('#results').hidden=true;clearInterval(timer);close();render();return}
  const nv=q('[data-route]');
  if(nv){state.route=nv.dataset.route;document.body.classList.remove('nav-on');$('#results').hidden=true;close();render();return}
  const op=q('[data-open]');
  if(op){({assign:mAssign,upload:mUpload,note:mNote,review:mReview,assistant:pAssistant})[op.dataset.open]();return}
  if(q('#bell')){pNotif();return}
  if(q('#fab')){pAssistant();return}
  if(q('#hamb')){document.body.classList.toggle('nav-on');return}
  const as=q('[data-assign]');
  if(as){$$('[data-assign]').forEach(b=>b.setAttribute('aria-pressed','false'));as.setAttribute('aria-pressed','true');state.assign=as.dataset.assign;return}
  if(q('[data-assign-ok]')){close();render();toast('담당 업무를 전환했습니다');return}
  if(q('[data-upstart]')){runUp();return}
  if(q('[data-approve]')){clearInterval(timer);close();state.route='docs';render();toast('초안 검토를 완료했습니다');return}
  if(q('[data-savenote]')){close();toast('저장했습니다 (시연)');return}
  if(q('[data-readall]')){$$('.notif').forEach(n=>n.classList.remove('new'));toast('모두 읽음으로 표시했습니다 (시연)');return}
  const df=q('[data-docf]');if(df){state.docF=df.dataset.docf;render();return}
  const nf=q('[data-notef]');if(nf){state.noteF=nf.dataset.notef;render();return}
  const so=q('[data-sort]');
  if(so){const k=so.dataset.sort;state.sort=state.sort.k===k?{k,d:state.sort.d==='asc'?'desc':'asc'}:{k,d:'asc'};render();return}
  const cb=q('[data-check]');
  if(cb){const id=state.task,i=+cb.dataset.check;const arr=state.checks[id]||state.checks.t2;arr[i].on=!arr[i].on;render();return}
  const fc=q('.fchip:not([data-docf]):not([data-notef])');
  if(fc){fc.setAttribute('aria-pressed',fc.getAttribute('aria-pressed')==='true'?'false':'true');return}
  const opt=q('.opt:not([data-assign])');
  if(opt){$$('.opt',opt.parentElement).forEach(b=>b.setAttribute('aria-pressed','false'));opt.setAttribute('aria-pressed','true');return}
  if(!q('.search-wrap'))$('#results').hidden=true;
});

$('#q').addEventListener('input',e=>search(e.target.value));

/* 데스크톱 단축키: / 검색, g+h/m/d/n/i 이동, Esc 닫기 */
let gKey=false;
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(e.key==='Escape'){clearInterval(timer);close();$('#results').hidden=true;document.body.classList.remove('nav-on')}
  if(e.key==='/'&&!typing){e.preventDefault();$('#q').focus()}
  if(!typing){
    if(e.key==='g'){gKey=true;setTimeout(()=>gKey=false,900);return}
    if(gKey){const m={h:'home',m:'map',d:'docs',n:'notes',i:'handover'}[e.key];
      if(m){gKey=false;state.route=m;close();render()}}
  }
  if(e.key==='Tab'&&$('#ov').firstElementChild){
    const f=$$('#ov button,#ov input,#ov textarea').filter(x=>!x.disabled);
    if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
  }
});

render();
</script>
